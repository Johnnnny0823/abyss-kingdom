name: abyss-analytics
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ANALYTICS_DB:?Set ANALYTICS_DB}
      POSTGRES_USER: ${ANALYTICS_USER:?Set ANALYTICS_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_PASSWORD:?Set ANALYTICS_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
